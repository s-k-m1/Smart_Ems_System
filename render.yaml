services:
  - type: web
    name: smart-ems
    runtime: php
    region: singapore
    plan: free
    buildCommand: ./build.sh
    startCommand: ./start.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: smart-ems
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: YOUR_MYSQL_HOST
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: smart_ems
      - key: DB_USERNAME
        value: YOUR_DB_USER
      - key: DB_PASSWORD
        value: YOUR_DB_PASSWORD
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: file
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: skycse001@gmail.com
      - key: MAIL_PASSWORD
        value: YOUR_GMAIL_APP_PASSWORD
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: skycse001@gmail.com
      - key: MAIL_FROM_NAME
        value: Smart EMS
